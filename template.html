<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OZ Healthcare Claims Dashboard</title>
<style>
/* Design tokens from Montage (wanteddev/montage-web, MIT): cool-neutral, blue, typography, radius, spacing */
:root{--bg:#F7F7F8;--card:#FFFFFF;--fg:#171719;--fg2:rgba(46,47,51,.88);--mute:rgba(55,56,60,.61);--accent:#0066FF;--line:rgba(112,115,124,.22);--line2:rgba(112,115,124,.16);--track:rgba(112,115,124,.08);--radius:12px;
 --font:"Wanted Sans Variable","Wanted Sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F0F10;--card:#1B1C1E;--fg:#F7F7F8;--fg2:rgba(194,196,200,.88);--mute:rgba(174,176,182,.61);--accent:#3385FF;--line:rgba(112,115,124,.22);--line2:rgba(112,115,124,.16);--track:rgba(112,115,124,.22)}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:400 .9375rem/1.375rem var(--font);letter-spacing:.0096em;word-break:keep-all}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:1.5rem;line-height:2rem;font-weight:700;letter-spacing:-.023em;margin:0 0 8px}
.headline{font-size:1.125rem;line-height:1.625rem;font-weight:600;letter-spacing:-.002em;margin:0 0 8px;max-width:62ch}
.note{color:var(--mute);max-width:70ch;margin:0 0 24px;font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em}
main{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
@media (min-width:760px){.wide{grid-column:span 2}}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);padding:20px;overflow:auto;min-width:0}
.card h2{font-size:.875rem;line-height:1.25rem;font-weight:600;letter-spacing:.0145em;margin:0 0 16px;color:var(--fg2)}
.kpi{font-size:1.75rem;line-height:2.375rem;font-weight:700;letter-spacing:-.0236em;font-variant-numeric:tabular-nums}.kpi small{font-size:.875rem;color:var(--mute);margin-left:4px;font-weight:400;letter-spacing:.0145em}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.875rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line2)}
th{font-size:.75rem;font-weight:500;color:var(--mute);letter-spacing:.0252em}
svg text{fill:var(--mute);font-size:11px}
.hbar{display:grid;grid-template-columns:auto 1fr auto;gap:12px 12px;align-items:center;font-variant-numeric:tabular-nums}
.hbar .track{height:16px;background:var(--track);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:4px}
.hbar .val{text-align:right;font-weight:500}
.filter{display:flex;gap:12px;align-items:center;margin:0 0 16px;font-size:.875rem;color:var(--fg2)}
.filter input,.filter button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.filter button{cursor:pointer}
</style></head><body><div class="wrap">
<h1>OZ Healthcare Claims Dashboard</h1>
<p class="headline" id="headline"></p>
<p class="note">외래(031) 호흡기(J코드) 명세서, 2024-01~2025-12, 연습용 데이터. 진료비는 명세서 1건당 총진료비의 중앙값입니다. 차이를 보여줄 뿐 원인을 설명하지 않으며 연령·성별은 보정하지 않았습니다. 보험료 5분위가 없는 환자는 소득 분석에서 제외했습니다.</p>
<div class="filter"><label>기간 <input type="month" id="from"> ~ <input type="month" id="to"></label><button type="button" id="reset">전체</button></div>
<main id="app"></main></div>
<script>
const CONFIG = /*__CONFIG__*/{};
const fmt = n => Number(n).toLocaleString("ko-KR");

// round tick values 0..top with top above the maximum
function ticks(max) {
  const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  let top = Math.ceil(max / step) * step;
  if (top <= max) top += step;
  const out = [];
  for (let v = 0; v <= top + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

function plot(d, line) {
  const n = d.values.length;
  if (!n) return "<p>no data</p>";
  const suf = d.suffix || "", lab = v => fmt(v) + suf;
  const t = ticks(Math.max(...d.values, 1)), top = t[t.length - 1];
  const W = 320, H = 190, pl = Math.max(...t.map(v => lab(v).length)) * 6 + 10, pr = 8, pt = 8, pb = 24;
  const bw = (W - pl - pr) / n, x = i => pl + i * bw + bw / 2, y = v => H - pb - (v / top) * (H - pb - pt);
  const grid = t.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 1}"/><text x="${pl - 6}" y="${y(v)}" dy=".35em" text-anchor="end">${lab(v)}</text>`).join("");
  const body = line
    ? `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${d.values.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>` +
      d.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="8" fill="transparent"><title>${d.labels[i]}: ${lab(v)}</title></circle>`).join("")
    : d.values.map((v, i) => `<rect x="${pl + i * bw + 1}" y="${y(v)}" width="${Math.max(bw - 2, 1)}" height="${y(0) - y(v)}" fill="var(--accent)"><title>${d.labels[i]}: ${lab(v)}</title></rect>`).join("");
  const step = Math.ceil(n / 6);
  const xl = d.labels.map((l, i) => i % step ? "" : `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${body}${xl}</svg>`;
}

function hbar(d) {
  const suf = d.suffix || "", mx = Math.max(...d.values, 1);
  return `<div class="hbar">${d.labels.map((l, i) =>
    `<span>${l}</span><div class="track"><div class="fill" style="width:${d.values[i] / mx * 100}%"></div></div><span class="val">${fmt(d.values[i])}${suf}</span>`).join("")}</div>`;
}

const R = {
  kpi: d => `<div class="kpi">${fmt(d.value)}<small>${d.unit || ""}</small></div>`,
  table: d => `<table><tr>${d.columns.map(c => `<th>${c}</th>`).join("")}</tr>${d.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`,
  bar: d => plot(d, false),
  line: d => plot(d, true),
  hbar,
};
async function load() {
  const app = document.getElementById("app");
  const p = { p_from: document.getElementById("from").value || null, p_to: document.getElementById("to").value || null };
  app.setAttribute("aria-busy", "true");
  try {
    const res = await fetch(`${CONFIG.url}/rest/v1/rpc/dashboard`, {
      method: "POST",
      headers: { apikey: CONFIG.key, Authorization: `Bearer ${CONFIG.key}`, "Content-Type": "application/json" },
      body: JSON.stringify(p),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const METRICS = await res.json();
    const head = METRICS.find(m => m.chart === "headline");
    document.getElementById("headline").textContent = head ? head.data.text : "";
    app.innerHTML = METRICS.filter(m => m.chart !== "headline").map(m =>
      `<section class="card${m.wide ? " wide" : ""}"><h2>${m.question}</h2>${(R[m.chart] || (() => "unknown chart"))(m.data)}</section>`).join("");
  } catch (e) {
    app.innerHTML = `<section class="card wide"><h2>데이터를 불러오지 못했습니다</h2><p>${String(e.message).replace(/</g, "&lt;")}</p></section>`;
  } finally {
    app.removeAttribute("aria-busy");
  }
}
document.getElementById("from").onchange = document.getElementById("to").onchange = load;
document.getElementById("reset").onclick = () => { document.getElementById("from").value = document.getElementById("to").value = ""; load(); };
load();
</script></body></html>
