<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OZ Healthcare Claims Dashboard</title>
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#1a1a1a;--mute:#6b7280;--accent:#2563eb;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d24;--fg:#e8eaed;--mute:#9aa0a6;--accent:#60a5fa;--line:#2a2e37}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 16px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto}
.card h2{font-size:14px;font-weight:600;margin:0 0 12px;color:var(--mute)}
.kpi{font-size:32px;font-weight:700}.kpi small{font-size:14px;color:var(--mute);margin-left:4px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
svg text{fill:var(--mute);font-size:10px}
</style></head><body>
<h1>OZ Healthcare Claims Dashboard</h1><p style="color:var(--mute);max-width:70ch;margin:0 0 16px">외래(031) 호흡기(J코드) 명세서, 2024-01~2025-12, 연습용 데이터. 진료비는 명세서 1건당 총진료비의 중앙값입니다. 차이를 보여줄 뿐 원인을 설명하지 않으며 연령·성별은 보정하지 않았습니다. 보험료 5분위가 없는 환자는 소득 분석에서 제외했습니다.</p><main id="app"></main>
<script>
const METRICS = /*__METRICS__*/[];
const fmt = n => Number(n).toLocaleString("ko-KR");
const R = {
  kpi: d => `<div class="kpi">${fmt(d.value)}<small>${d.unit || ""}</small></div>`,
  table: d => `<table><tr>${d.columns.map(c => `<th>${c}</th>`).join("")}</tr>${d.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`,
  bar: d => plot(d, false),
  line: d => plot(d, true),
};
function plot(d, line) {
  const W = 320, H = 160, p = 24, n = d.values.length, max = Math.max(...d.values, 1);
  if (!n) return "<p>no data</p>";
  const x = i => p + (n < 2 ? 0 : i * (W - 2 * p) / (n - 1)), bw = (W - 2 * p) / n, y = v => H - p - (v / max) * (H - 2 * p);
  const body = line
    ? `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${d.values.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>`
    : d.values.map((v, i) => `<rect x="${p + i * bw + 1}" y="${y(v)}" width="${Math.max(bw - 2, 1)}" height="${H - p - y(v)}" fill="var(--accent)"><title>${d.labels[i]}: ${fmt(v)}</title></rect>`).join("");
  const step = Math.ceil(n / 6);
  const ticks = d.labels.map((l, i) => i % step ? "" : `<text x="${line ? x(i) : p + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${l}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><text x="${p}" y="10">max ${fmt(max)}</text>${body}${ticks}</svg>`;
}
document.getElementById("app").innerHTML = METRICS.map(m =>
  `<section class="card"><h2>${m.question}</h2>${(R[m.chart] || (() => "unknown chart"))(m.data)}</section>`).join("");
</script></body></html>
